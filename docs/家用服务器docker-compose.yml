networks:
  beidou-network:
    driver: bridge

# ── 可选：进程"卡死但没退出"的自愈 ─────────────────────────────
# restart 策略只对"进程退出"生效；JVM 死锁/挂住时 healthcheck 会变 unhealthy
# 但 Docker 不会自动重启。启用下面这个边车后，unhealthy 超时的容器会被强制重启。
# 启用方法：取消注释，并给 beidou-server-all 加 label: autoheal: "true"
