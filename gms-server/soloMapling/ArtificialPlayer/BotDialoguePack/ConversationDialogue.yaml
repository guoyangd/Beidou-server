    lines:
      - {speaker: A, text: "打BOSS龙骑还是英雄 说"}
      - {speaker: B, text: "英雄。黑眼酷是酷 但英雄实战输出更高"}
      - {speaker: A, text: "龙骑有黑眼buff加献祭 功能性强"}
      - {speaker: B, text: "英雄有怒火和斗气爆发 持久战纯伤赢"}
      - {speaker: A, text: "龙骑更肉 混沌本重要"}
      - {speaker: B, text: "有道理 单说扎昆龙骑更稳"}
      - {speaker: A, text: "我就觉得黑眼帅 帅也算数", emote: 3}
      - {speaker: B, text: "选职业的正当理由 颜值即正义"}

  party_buffing_etiquette:
    participants: 3
    lines:
      - {speaker: A, text: "能不能立个规矩 加buff先喊再加 别加完才喊"}
      - {speaker: B, text: "哈哈怎么了"}
      - {speaker: A, text: "开打瞬间主教把我的快速盖了"}
      - {speaker: C, text: "哦豁 祝福和快速重叠很麻烦"}
      - {speaker: B, text: "理想方案是开打前会频说好顺序"}
      - {speaker: A, text: "但没人这么做 全靠莽"}
      - {speaker: C, text: "我永远法师buff先 战士再 牧师垫 没出过事"}
      - {speaker: B, text: "这该成为通用标准", emote: 2}
      - {speaker: A, text: "广而告之 buff顺序救命"}

  late_night_grind:
    participants: 2
    lines:
      - {speaker: A, text: "凌晨两点还在骨龙图 救命"}
      - {speaker: B, text: "同 我在僵尸山 停不下来 再一级"}
      - {speaker: A, text: "'再一级'是我三小时以来的谎言", emote: 14}
      - {speaker: B, text: "深夜服务器安静 经验条动得特别爽"}
      - {speaker: A, text: "真的 莫名安宁"}
      - {speaker: B, text: "我四小时后要起床哈哈"}
      - {speaker: A, text: "同 但冒险岛时间不管现实时间"}
      - {speaker: B, text: "好好好 这次真下了"}
      - {speaker: A, text: "信你 大概30分钟后见"}

  quitting_and_returning:
    participants: 2
    lines:
      - {speaker: A, text: "我弃坑8个月上周刚回来"}
      - {speaker: B, text: "欢迎回归哈哈 什么把你勾回来的"}
      - {speaker: A, text: "说真的就是怀旧 想这个味儿了"}
      - {speaker: B, text: "人人都会 这游戏有引力"}
      - {speaker: A, text: "没想到加点图点全还记得"}
      - {speaker: B, text: "肌肉记忆忘不掉 手指还记得连招", emote: 2}
      - {speaker: A, text: "补了点知识 捡得很快"}
      - {speaker: B, text: "冒险岛就是这样 回来就像回家"}

  fame_farming_discussion:
    participants: 3
    lines:
      - {speaker: A, text: "现在还有人在乎人气吗"}
      - {speaker: B, text: "不在乎 但看它涨还是爽"}
      - {speaker: C, text: "有些店还看人气定交易资格"}
      - {speaker: A, text: "以前市场查人气才肯交易 太怪了"}
      - {speaker: B, text: "我攒了200人气才发现根本没人查", emote: 6}
      - {speaker: C, text: "跟路人互刷人气其实挺社交的"}
      - {speaker: A, text: "对 通过刷人气认识了不少人"}
      - {speaker: B, text: "本质是每天免费跟陌生人说话的理由"}

  fm_room_navigation:
    participants: 2
    lines:
      - {speaker: A, text: "市场房号怎么这么迷"}
      - {speaker: B, text: "就是 我迷了10分钟找人"}
      - {speaker: A, text: "永远记不住哪个门通哪片"}
      - {speaker: B, text: "我的策略是见门就进 靠缘分", emote: 3}
      - {speaker: A, text: "地图明明有 但完全没用"}
      - {speaker: B, text: "设计市场布局的人想象力独特"}
      - {speaker: A, text: "我只记死要去的店 直奔"}
      - {speaker: B, text: "熟了就是肌肉记忆 大概几周"}

  boss_prep_checklist:
    participants: 2
    lines:
      - {speaker: A, text: "半小时后扎昆 你好了吗"}
      - {speaker: B, text: "还得再买300瓶红药"}
      - {speaker: A, text: "至少再来一组特疗 手打人太疼"}
      - {speaker: B, text: "要命中装吗 还是基础命中够"}
      - {speaker: A, text: "你这等级够了 保险起见带个命中戒"}
      - {speaker: B, text: "好这就去买。复活有着落吗"}
      - {speaker: A, text: "主教朋友说可以 复活稳了"}
      - {speaker: B, text: "好 我每次手阶段至少死一次哈哈", emote: 7}
      - {speaker: A, text: "我也是 硬扛过去就行"}

  alt_character_confession:
    participants: 3
    lines:
      - {speaker: A, text: "我有4个小号 并且很内疚"}
      - {speaker: B, text: "内疚什么 小号很正常"}
      - {speaker: A, text: "因为没一个超过60级 还老想开新的"}
      - {speaker: C, text: "哦不 你是小号 hopper 我一眼就认出来了", emote: 3}
      - {speaker: A, text: "对新职业上头 然后迅速失去兴趣"}
      - {speaker: B, text: "新号前30级确实新鲜"}
      - {speaker: C, text: "然后撞上练级墙 又去开新号"}
      - {speaker: A, text: "精准 这是一个死循环"}
      - {speaker: B, text: "总有一个会留下来的 找到你的本命职业就行"}

  nx_cosmetic_priorities:
    participants: 2
    lines:
      - {speaker: A, text: "给你3万点券你先买什么"}
      - {speaker: B, text: "发型券 无条件。先帅再说"}
      - {speaker: A, text: "我在想要不要商城那套套装"}
      - {speaker: B, text: "薄暮行者那套？确实干净"}
      - {speaker: A, text: "帽子难搭 跟多数装备帽冲突"}
      - {speaker: B, text: "所以点券帽永远优先 解放穿搭"}
      - {speaker: A, text: "有道理 那先帽还是先发型"}
      - {speaker: B, text: "先发型。发型之上一切让路", emote: 3}

  el_nath_cold_complaints:
    participants: 2
    lines:
      - {speaker: A, text: "为什么雪原的冰冻debuff每次都烦到我"}
      - {speaker: B, text: "是屏幕上的雪花对吧 太干扰"}
      - {speaker: A, text: "整个变迟钝 还丑"}
      - {speaker: B, text: "上去之前在底下NPC那买解冻剂"}
      - {speaker: A, text: "每次都忘。每次"}
      - {speaker: B, text: "至少不被冻僵的时候图挺好看"}
      - {speaker: A, text: "山上音乐不错 很有氛围"}
      - {speaker: B, text: "雪原氛围分拉满 冰冻机制扣分", emote: 4}

  pq_partner_search:
    participants: 3
    lines:
      - {speaker: A, text: "找玩具本车队 差3人"}
      - {speaker: B, text: "什么等级段"}
      - {speaker: A, text: "35到50都行 有牧师buff不愁"}
      - {speaker: C, text: "哦哦我41能进吗"}
      - {speaker: A, text: "能！！什么职业"}
      - {speaker: C, text: "冰雷法师 雷暴已备好"}
      - {speaker: B, text: "石头人那关很猛 我也来 刀飞"}
      - {speaker: A, text: "完美走起 入口传送门集合", emote: 11}

  scroll_success_witness:
    participants: 2
    lines:
      - {speaker: A, text: "哟我刚目睹有人70%卷手套连过7张"}
      - {speaker: B, text: "离谱 这概率多低"}
      - {speaker: A, text: "他疯了 在市场里蹦"}
      - {speaker: B, text: "应该的 70%连过7张是神迹"}
      - {speaker: A, text: "干净手套直接变准完美 太震撼"}
      - {speaker: B, text: "复制这结果得花5000万黑暗卷", emote: 12}
      - {speaker: A, text: "正是 传奇市场时刻 全场欢呼"}
      - {speaker: B, text: "真想当时在场"}

  leveling_speed_comparison:
    participants: 2
    lines:
      - {speaker: A, text: "你多久到的120"}
      - {speaker: B, text: "休闲着玩大概3个月 最多4个月"}
      - {speaker: A, text: "不慢了。我118卡了三周"}
      - {speaker: B, text: "115到120的墙是真的 经验需求暴涨"}
      - {speaker: A, text: "我在骨龙图 但抢图太狠"}
      - {speaker: B, text: "试试错峰 深夜或清早"}
      - {speaker: A, text: "要不定个6点的闹钟 听着离谱但"}
      - {speaker: B, text: "我干过 不丢人 清晨空图是黄金", emote: 2}

  guild_boss_run_planning:
    participants: 4
    lines:
      - {speaker: A, text: "好 公会周六晚7点扎昆 谁能来"}
      - {speaker: B, text: "到。提前补药"}
      - {speaker: C, text: "我6点下班 最晚7点半上"}
      - {speaker: D, text: "我有空。这次主教确定了吗"}
      - {speaker: A, text: "太阳说能来 复活有保障"}
      - {speaker: B, text: "还要补人吗 还是已经6个了"}
      - {speaker: C, text: "稳妥起见至少8个"}
      - {speaker: A, text: "我去招募频道发 还差2"}
      - {speaker: D, text: "确保他们防御上100 上次太惨了", emote: 5}

  losing_track_of_time:
    participants: 2
    lines:
      - {speaker: A, text: "兄弟我坐下说玩一小时 现在五小时了"}
      - {speaker: B, text: "冒险岛时间走另一套钟 是已知现象"}
      - {speaker: A, text: "我以为才9点 结果半夜12点"}
      - {speaker: B, text: "说明你进入心流了", emote: 3}
      - {speaker: A, text: "副本连着打 车队秒组"}
      - {speaker: B, text: "车队顺的时候确实停不下来"}
      - {speaker: A, text: "而且我明早有课 完美决策"}
      - {speaker: B, text: "都经历过 值了对吧"}
      - {speaker: A, text: "……嗯说真的值", emote: 2}

  training_spot_etiquette:
    participants: 3
    lines:
      - {speaker: A, text: "图上已经有人在练 你换线还是留下"}
      - {speaker: B, text: "看图大小 大图拼 小图换"}
      - {speaker: C, text: "我先问一句 这图有人吗"}
      - {speaker: A, text: "问的人多数好说话 直接挤进来的才烦"}
      - {speaker: B, text: "对 至少打个招呼"}
      - {speaker: C, text: "有人直接在我旁边开刷 一句话没有", emote: 6}
      - {speaker: A, text: "然后还得你去开口 尴尬"}
      - {speaker: B, text: "练级图的社会契约真实存在 必须尊重"}

  mage_skill_rotation:
    participants: 2
    lines:
      - {speaker: A, text: "火毒打BOSS怎么循环"}
      - {speaker: B, text: "基本是毒雾然后陨石 触发元素增幅就放"}
      - {speaker: A, text: "中间补普攻吗 还是等毒跳"}
      - {speaker: B, text: "间隙丢火箭 毒生效时保持伤害"}
      - {speaker: A, text: "迟缓对BOSS重要吗"}
      - {speaker: B, text: "BOSS多数免疫 不重要。清图很重要"}
      - {speaker: A, text: "懂了 火毒复杂但上手后很爽"}
      - {speaker: B, text: "最吃操作的职业之一 从不无聊", emote: 2}

  henesys_market_gossip:
    participants: 3
    lines:
      - {speaker: A, text: "射手村有人半价卖黑镖"}
      - {speaker: B, text: "要么是假货 要么急用钱"}
      - {speaker: C, text: "我看了 属性是真的"}
      - {speaker: A, text: "可能清仓 有时候是这样"}
      - {speaker: B, text: "或者倒卖党钓鱼 换地方高价出"}
      - {speaker: C, text: "哇没想过这层 阴险", emote: 6}
      - {speaker: A, text: "有人把市场当商学院"}
      - {speaker: B, text: "而且赚得比练级的人多多了哈哈"}

  slow_leveling_acceptance:
    participants: 2
    lines:
      - {speaker: A, text: "我73级卡了两周 一点不焦虑"}
      - {speaker: B, text: "心态真好 这游戏是马拉松"}
      - {speaker: A, text: "想玩就玩 不赶进度"}
      - {speaker: B, text: "羡慕 我老盯着等级数字"}
      - {speaker: A, text: "享受过程比追终点舒服"}
      - {speaker: B, text: "好睿智。你是哲学家还是单纯懒哈哈"}
      - {speaker: A, text: "大概两者兼有", emote: 3}
      - {speaker: B, text: "respect 聊完这波我也要佛系点"}

  warrior_weapon_debate:
    participants: 2
    lines:
      - {speaker: A, text: "龙骑毕业武器 枪还是矛"}
      - {speaker: B, text: "矛打得目标多 练级好 枪单体高"}
      - {speaker: A, text: "专打扎昆的话选枪打手"}
      - {speaker: B, text: "对 BOSS向build矛更合理"}
      - {speaker: A, text: "攻速差多少 影响大吗"}
      - {speaker: B, text: "开了快速标差距很小 矛群攻略胜"}
      - {speaker: A, text: "唉 为什么不能简单点"}
      - {speaker: B, text: "战士永恒的争论 顺手哪个用哪个", emote: 2}

  drop_rate_conspiracy:
    participants: 2
    lines:
      - {speaker: A, text: "我发誓连杀的时候掉率更差"}
      - {speaker: B, text: "就像游戏惩罚打得太好的"}
      - {speaker: A, text: "对 连杀500只毛都没有 杀3只出稀有"}
      - {speaker: B, text: "那是随机性在跟你作对哈哈"}
      - {speaker: A, text: "我知道 但感觉不随机"}
      - {speaker: B, text: "那是大脑在没有规律的地方找规律", emote: 3}
      - {speaker: A, text: "我的脑子错了 但它很笃定"}
      - {speaker: B, text: "经典冒险岛体验 上头时的概率特别玄"}

  maple_anniversary_memories:
    participants: 3
    lines:
      - {speaker: A, text: "当年的周年庆活动太棒了"}
      - {speaker: B, text: "蛋糕怪地图！！又乱又好玩"}
      - {speaker: C, text: "全员刷周年币换活动戒指"}
      - {speaker: A, text: "还发免费道具 跟过节一样"}
      - {speaker: B, text: "周年帽子稀有 之后能炫很久"}
      - {speaker: C, text: "我小号上还留着第一顶周年帽"}
      - {speaker: A, text: "那种活动让全服像在一起庆祝", emote: 2}
      - {speaker: B, text: "那时候的冒险岛真懂社区活动"}

  party_finding_struggle:
    participants: 2
    lines:
      - {speaker: A, text: "找副本队25分钟了 没人组"}
      - {speaker: B, text: "哪个本"}
      - {speaker: A, text: "废弃本。人都在等 但没人愿意当队长"}
      - {speaker: B, text: "经典。都想上车没人开车"}
      - {speaker: A, text: "我倒是想带 但谜题我还没背熟"}
      - {speaker: B, text: "论坛有攻略 五分钟背完基础"}
      - {speaker: A, text: "那我来当。能有多难"}
      - {speaker: B, text: "你能行的 说一句第一次带 大家都有耐心", emote: 2}

  potion_expense_complaining:
    participants: 3
    lines:
      - {speaker: A, text: "上周买药花了200万枫币。两百万"}
      - {speaker: B, text: "你多少级 这有点多"}
      - {speaker: A, text: "130 骨龙图吃药跟喝水一样"}
      - {speaker: C, text: "试试特疗代替红药 有时性价比更高"}
      - {speaker: A, text: "单价贵但更耐用是吧"}
      - {speaker: B, text: "真正的解药是交个主教朋友 花圣加奶 改变一切"}
      - {speaker: C, text: "我跟主教搭伙后药钱砍半"}
      - {speaker: A, text: "哪里速购一位主教朋友", emote: 6}
      - {speaker: B, text: "公会招人 永远缺主教"}

  guild_recruitment_pitch:
    participants: 2
    lines:
      - {speaker: A, text: "嘿要入会吗 我们挺活跃"}
      - {speaker: B, text: "什么样的会"}
      - {speaker: A, text: "休闲向 每周打两次BOSS 20个人"}
      - {speaker: B, text: "有等级要求吗"}
      - {speaker: A, text: "二转以上就行 不太看等级"}
      - {speaker: B, text: "氛围呢 卷王还是快乐游戏"}
      - {speaker: A, text: "快乐为主 会频天天说笑"}
      - {speaker: B, text: "听着不错 怎么加", emote: 2}
      - {speaker: A, text: "这就给你发邀请 欢迎上船"}

  job_advance_celebration:
    participants: 3
    lines:
      - {speaker: A, text: "兄弟们我三转了！！", emote: 12}
      - {speaker: B, text: "冲冲冲！！转的什么"}
      - {speaker: A, text: "龙骑士宝贝 黑眼是我的了"}
      - {speaker: C, text: "哦龙骑太酷了 真心恭喜"}
      - {speaker: A, text: "任务有点磨人 但值"}
      - {speaker: B, text: "黑眼用起来什么感觉"}
      - {speaker: A, text: "爽爆 像随身带了个加buff的小伙伴"}
      - {speaker: C, text: "黑眼献祭会在BOSS战救你命 信我", emote: 2}
      - {speaker: A, text: "这是我几个月来最开心的一天"}

  losing_a_good_scroll:
    participants: 2
    lines:
      - {speaker: A, text: "刚浴袍60%炸了 我想退游"}
      - {speaker: B, text: "唉 之前几张"}
      - {speaker: A, text: "已经过2张60了 这张本来想帽子戏法"}
      - {speaker: B, text: "结果第三张炸了 残忍的讽刺"}
      - {speaker: A, text: "早知道2张就收手 见好就收vs未知贪婪"}
      - {speaker: B, text: "2张的浴袍也还是好东西 别扔", emote: 4}
      - {speaker: A, text: "知道 我在悼念那个可能"}
      - {speaker: B, text: "给它10分钟 砸卷之痛是暂时的"}

  unexpected_pk_encounter:
    participants: 2
    lines:
      - {speaker: A, text: "有人在僵尸蘑菇抢我怪还骂我菜"}
      - {speaker: B, text: "哈哈经典 你怎么办的"}
      - {speaker: A, text: "输出压他全场 然后他红温退了"}
      - {speaker: B, text: "正义。被抢怪的正确回应"}
      - {speaker: A, text: "他叫了个朋友回来两边夹我"}
      - {speaker: B, text: "他们真为僵尸蘑菇组织了一场报复？", emote: 6}
      - {speaker: A, text: "千真万确 然后我就换图了"}
      - {speaker: B, text: "有时候图不值得这场戏哈哈"}

  old_friend_reunion:
    participants: 3
    lines:
      - {speaker: A, text: "等等 那是令狐冲？兄弟你去哪了"}
      - {speaker: B, text: "哇 居然是你 去年就没见过你"}
