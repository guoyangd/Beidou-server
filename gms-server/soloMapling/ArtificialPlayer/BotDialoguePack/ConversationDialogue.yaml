conversations:

  # ═══════════════════════════════════════
  #  双人对话
  # ═══════════════════════════════════════

  training_spot_debate:
    participants: 2
    lines:
      - {speaker: A, text: "你都在哪练级？"}
      - {speaker: B, text: "基本都在猪的海滩"}
      - {speaker: A, text: "那不是有点慢吗？", emote: 5}
      - {speaker: B, text: "慢是慢但安逸 没人烦我"}
      - {speaker: A, text: "行吧有道理哈哈"}

  training_spot_debate_2:
    participants: 2
    lines:
      - {speaker: A, text: "45级该去哪练？"}
      - {speaker: B, text: "神秘小径3或者火鱼图"}
      - {speaker: A, text: "哪个快"}
      - {speaker: B, text: "有宠物去火鱼 没有去小径"}
      - {speaker: A, text: "好嘞谢了！", emote: 2}

  class_debate:
    participants: 2
    lines:
      - {speaker: A, text: "全游戏最强职业是什么"}
      - {speaker: B, text: "隐士 还用问", emote: 3}
      - {speaker: A, text: "哈哈不可能。主教实用多了"}
      - {speaker: B, text: "实用归实用 隐士伤害最高"}
      - {speaker: A, text: "随便吧兄弟", emote: 1}
      - {speaker: B, text: "急了急了哈哈", emote: 3}

  class_debate_2:
    participants: 2
    lines:
      - {speaker: A, text: "我该练战士还是法师"}
      - {speaker: B, text: "看你想要什么。战士能抗 法师群攻猛"}
      - {speaker: A, text: "我想耍帅"}
      - {speaker: B, text: "那练龙骑士哈哈", emote: 2}
      - {speaker: A, text: "成交"}

  item_price_haggle:
    participants: 2
    lines:
      - {speaker: A, text: "黑镖多少？"}
      - {speaker: B, text: "一组450万"}
      - {speaker: A, text: "有点贵……350？"}
      - {speaker: B, text: "不行最低400"}
      - {speaker: A, text: "行", emote: 2}
      - {speaker: B, text: "交易吧"}

  item_price_haggle_2:
    participants: 2
    lines:
      - {speaker: A, text: "出 10%手套攻击卷"}
      - {speaker: B, text: "多少钱"}
      - {speaker: A, text: "6000万"}
      - {speaker: B, text: "哈哈不了谢谢", emote: 4}
      - {speaker: A, text: "行 5000万最终价"}
      - {speaker: B, text: "不买 祝你卖出去"}

  quest_help:
    participants: 2
    lines:
      - {speaker: A, text: "知道蘑菇神社在哪吗？"}
      - {speaker: B, text: "知道 从天空之城坐船"}
      - {speaker: A, text: "有船？？", emote: 5}
      - {speaker: B, text: "哈哈天空之塔顶上有售票处"}
      - {speaker: A, text: "哦哦好嘞谢谢", emote: 2}

  quest_help_2:
    participants: 2
    lines:
      - {speaker: A, text: "有人知道怎么去雪原吗？"}
      - {speaker: B, text: "到天空之城然后下塔"}
      - {speaker: A, text: "整座塔？？要走多久"}
      - {speaker: B, text: "大概20层哈哈"}
      - {speaker: A, text: "好家伙", emote: 7}

  real_life_school:
    participants: 2
    lines:
      - {speaker: A, text: "唉明天有考试"}
      - {speaker: B, text: "巧了。数学？"}
      - {speaker: A, text: "对。一点没复习", emote: 7}
      - {speaker: B, text: "哈哈一样。没事能过"}
      - {speaker: A, text: "美好的愿望哈哈"}

  real_life_food:
    participants: 2
    lines:
      - {speaker: A, text: "晚饭吃的啥"}
      - {speaker: B, text: "泡面哈哈"}
      - {speaker: A, text: "经典玩家燃料", emote: 2}
      - {speaker: B, text: "纯属无奈 信我", emote: 4}

  real_life_late_night:
    participants: 2
    lines:
      - {speaker: A, text: "兄弟凌晨三点了"}
      - {speaker: B, text: "所以呢"}
      - {speaker: A, text: "你明天不上学？"}
      - {speaker: B, text: "上 但再来一把"}
      - {speaker: A, text: "你一小时前也这么说哈哈", emote: 2}

  real_life_weather:
    participants: 2
    lines:
      - {speaker: A, text: "外面雨下得也太大了"}
      - {speaker: B, text: "最适合待家里玩冒险岛的天气", emote: 0}
      - {speaker: A, text: "太对了"}

  nostalgia_old_maple:
    participants: 2
    lines:
      - {speaker: A, text: "兄弟还记得射手村打猎场挤满人的时候吗"}
      - {speaker: B, text: "记得记得 全在抢线", emote: 2}
      - {speaker: A, text: "然后有人抢你怪 你就给他点黑名"}
      - {speaker: B, text: "哈哈人气大战。经典冒险岛"}
      - {speaker: A, text: "那时候真好啊", emote: 4}

  nostalgia_maple_island:
    participants: 2
    lines:
      - {speaker: A, text: "还记得枫叶岛吗"}
      - {speaker: B, text: "兄弟当然记得。那些蜗牛"}
      - {speaker: A, text: "我记得因为不会喝药被蓝蜗牛打死", emote: 7}
      - {speaker: B, text: "哈哈惨绝人寰", emote: 2}
      - {speaker: A, text: "谁还没当过萌新呢"}

  flex_compare:
    participants: 2
    lines:
      - {speaker: A, text: "看我新武器", emote: 3}
      - {speaker: B, text: "不错。多少钱"}
      - {speaker: A, text: "2亿"}
      - {speaker: B, text: "兄弟我1.5亿就能给你搞一把", emote: 5}
      - {speaker: A, text: "……别说了", emote: 4}

  flex_level:
    participants: 2
    lines:
      - {speaker: A, text: "今天70级了！！", emote: 2}
      - {speaker: B, text: "漂亮恭喜！", emote: 2}
      - {speaker: A, text: "三转比二转爽太多了"}
      - {speaker: B, text: "等你四转。完全是另一个游戏"}
      - {speaker: A, text: "等不及了"}

  afk_check:
    participants: 2
    lines:
      - {speaker: A, text: "在吗？"}
      - {speaker: B, text: "在 抱歉刚才挂机了"}
      - {speaker: A, text: "哈哈没事以为你掉线了"}
      - {speaker: B, text: "没有 去倒了杯水"}

  scam_warning:
    participants: 2
    lines:
      - {speaker: A, text: "兄弟刚才有人在市场想骗我"}
      - {speaker: B, text: "怎么回事"}
      - {speaker: A, text: "先摆了张白卷 最后一秒换成10%卷"}
      - {speaker: B, text: "经典骗局。交易前一定核对清楚", emote: 1}
      - {speaker: A, text: "是啊花钱买教训了", emote: 4}

  guild_talk:
    participants: 2
    lines:
      - {speaker: A, text: "你有公会吗？"}
      - {speaker: B, text: "有 桃花岛。挺活跃的"}
      - {speaker: A, text: "招人吗？正找会呢"}
      - {speaker: B, text: "招 私聊会长。说是我介绍的"}
      - {speaker: A, text: "好嘞谢了！", emote: 2}

  boss_planning:
    participants: 2
    lines:
      - {speaker: A, text: "今晚打扎昆？"}
      - {speaker: B, text: "几点"}
      - {speaker: A, text: "晚上8点？不过缺个主教"}
      - {speaker: B, text: "我问问会里兄弟。130多级的主教"}
      - {speaker: A, text: "完美走起", emote: 2}

  scroll_results:
    participants: 2
    lines:
      - {speaker: A, text: "刚给武器上60%卷连炸5张", emote: 6}
      - {speaker: B, text: "兄弟60%卷是骗人的 手感跟30%似的"}
      - {speaker: A, text: "真的。2亿打水漂"}
      - {speaker: B, text: "默哀"}

  scroll_results_2:
    participants: 2
    lines:
      - {speaker: A, text: "我刚60%卷7张全过！！", emote: 2}
      - {speaker: B, text: "不可能。证据呢", emote: 5}
      - {speaker: A, text: "千真万确。手都在抖"}
      - {speaker: B, text: "兄弟快去买彩票"}
      - {speaker: A, text: "哈哈真的"}

  fashion_talk:
    participants: 2
    lines:
      - {speaker: A, text: "哟这身哪买的"}
      - {speaker: B, text: "点券商城。刚冲了10块"}
      - {speaker: A, text: "值 看着很帅", emote: 2}
      - {speaker: B, text: "谢了。在射手村必须体面 你懂的", emote: 3}

  money_problems:
    participants: 2
    lines:
      - {speaker: A, text: "我穷死了", emote: 4}
      - {speaker: B, text: "多穷"}
      - {speaker: A, text: "全部身家5万枫币那种穷"}
      - {speaker: B, text: "兄弟这也叫钱 哈哈", emote: 2}
      - {speaker: A, text: "我知道 这才是问题", emote: 7}

  pet_talk:
    participants: 2
    lines:
      - {speaker: A, text: "买宠物值吗？"}
      - {speaker: B, text: "100%值。自动捡东西改变人生"}
      - {speaker: A, text: "买哪个好"}
      - {speaker: B, text: "功能都一样 买你觉得可爱的"}
      - {speaker: A, text: "那就哈士奇了", emote: 0}

  maple_gf:
    participants: 2
    lines:
      - {speaker: A, text: "我的冒险岛女友跟我分手了", emote: 4}
      - {speaker: B, text: "兄弟什么情况"}
      - {speaker: A, text: "她说找了个等级更高的"}
      - {speaker: B, text: "哈哈这也太狠了", emote: 2}
      - {speaker: A, text: "痛"}

  random_encounter:
    participants: 2
    lines:
      - {speaker: A, text: "嘿"}
      - {speaker: B, text: "嘿"}
      - {speaker: A, text: "……"}
      - {speaker: B, text: "……"}
      - {speaker: A, text: "今天天气不错"}
      - {speaker: B, text: "哈哈"}

  coming_back:
    participants: 2
    lines:
      - {speaker: A, text: "三年没玩刚回归"}
      - {speaker: B, text: "欢迎回来！多少级了"}
      - {speaker: A, text: "52。感觉又成萌新了哈哈"}
      - {speaker: B, text: "没事很快追上 现在升级快多了"}
      - {speaker: A, text: "那就好", emote: 0}

  dc_frustration:
    participants: 2
    lines:
      - {speaker: A, text: "我打BOSS打到一半掉线了！！", emote: 6}
      - {speaker: B, text: "惨。位置丢了吗"}
      - {speaker: A, text: "丢了 buff也全没"}
      - {speaker: B, text: "太惨了。这服最近老卡"}
      - {speaker: A, text: "心态崩了", emote: 1}

  fame_exchange:
    participants: 2
    lines:
      - {speaker: A, text: "互点人气？"}
      - {speaker: B, text: "行"}
      - {speaker: A, text: "好我点了"}
      - {speaker: B, text: "回点了", emote: 2}
      - {speaker: A, text: "谢！"}

  job_advancement:
    participants: 2
    lines:
      - {speaker: A, text: "我要去做三转了！！", emote: 2}
      - {speaker: B, text: "nice！什么职业"}
      - {speaker: A, text: "转游侠"}
      - {speaker: B, text: "稳。扫射伤害爆表"}
      - {speaker: A, text: "等不及试了"}

  server_drama:
    participants: 2
    lines:
      - {speaker: A, text: "听说昨天市场那场大戏了吗"}
      - {speaker: B, text: "没有 怎么了"}
      - {speaker: A, text: "有人复制道具被抓 当场封号"}
      - {speaker: B, text: "哈哈活该。复制党毁经济"}
      - {speaker: A, text: "真的"}

  # ═══════════════════════════════════════
  #  三人对话
  # ═══════════════════════════════════════

  pq_planning:
    participants: 3
    lines:
      - {speaker: A, text: "有人打天空副本吗？"}
      - {speaker: B, text: "我来。你多少级"}
      - {speaker: A, text: "58主教"}
      - {speaker: C, text: "加我。55隐士"}
      - {speaker: B, text: "完美。再找3个"}
      - {speaker: A, text: "天空2线集合"}
      - {speaker: C, text: "在路上"}

  pq_planning_2:
    participants: 3
    lines:
      - {speaker: A, text: "组废弃副本 差2"}
      - {speaker: B, text: "你几级"}
      - {speaker: A, text: "25刺客"}
      - {speaker: C, text: "我来。28牧师"}
      - {speaker: B, text: "行加我一个 废弃集合"}
      - {speaker: A, text: "走起", emote: 2}

  best_town_debate:
    participants: 3
    lines:
      - {speaker: A, text: "射手村是全岛第一城 谁赞成谁反对"}
      - {speaker: B, text: "魔法密林酷多了 音乐和树绝配"}
      - {speaker: C, text: "废弃都市氛围最好 那种暗巷风"}
      - {speaker: A, text: "兄弟废弃就是个垃圾场哈哈", emote: 2}
      - {speaker: B, text: "他说得对 废弃有味道"}
      - {speaker: C, text: "你们不懂欣赏", emote: 1}

  guild_drama:
    participants: 3
    lines:
      - {speaker: A, text: "兄弟我们会长两周没上线了"}
      - {speaker: B, text: "又来？？上个月不是也这样"}
      - {speaker: C, text: "要我说干脆自己建个会"}
      - {speaker: A, text: "我正想说。建会的钱我有"}
      - {speaker: B, text: "叫什么名"}
      - {speaker: C, text: "整个酷的。比如 忘忧楼 之类"}
      - {speaker: A, text: "哈哈行 让我想想"}

  someone_flexing:
    participants: 3
    lines:
      - {speaker: A, text: "哇我扭蛋出了张混沌卷！！", emote: 2}
      - {speaker: B, text: "不可能吧", emote: 5}
      - {speaker: C, text: "无图无真相"}
      - {speaker: A, text: "就在我背包里 自己看"}
      - {speaker: B, text: "兄弟这个能卖1亿多"}
      - {speaker: C, text: "或者自己砸 赌一把", emote: 3}
      - {speaker: A, text: "我砸了。人生豪迈"}
      - {speaker: B, text: "你疯了", emote: 5}

  boss_fight_recap:
    participants: 3
    lines:
      - {speaker: A, text: "刚才那把扎昆太刺激了"}
      - {speaker: B, text: "兄弟我差点死了三次", emote: 7}
      - {speaker: C, text: "我是真死了。两次。哈哈", emote: 4}
      - {speaker: A, text: "至少头盔掉了"}
      - {speaker: B, text: "谁拿了"}
      - {speaker: A, text: "我哈哈", emote: 3}
      - {speaker: C, text: "好家伙"}

  whos_strongest:
    participants: 3
    lines:
      - {speaker: A, text: "来 谁是这里最强的"}
      - {speaker: B, text: "显然是我", emote: 3}
      - {speaker: C, text: "你就60级 冷静点", emote: 2}
      - {speaker: B, text: "等级不代表一切好吗"}
      - {speaker: A, text: "还真能代表"}
      - {speaker: C, text: "哈哈"}

  late_night_group:
    participants: 3
    lines:
      - {speaker: A, text: "为什么我们凌晨四点都在线"}
      - {speaker: B, text: "因为我们毫无自制力"}
      - {speaker: C, text: "我7点就要上班了", emote: 7}
      - {speaker: A, text: "那快睡啊？？"}
      - {speaker: C, text: "再来一把"}
      - {speaker: B, text: "这就对了", emote: 2}

  training_recommendations:
    participants: 3
    lines:
      - {speaker: A, text: "嘿我35级去哪练"}
      - {speaker: B, text: "僵尸蘑菇不错"}
      - {speaker: C, text: "不 去怪物嘉年华快多了"}
      - {speaker: B, text: "嘉年华得有车队才行"}
      - {speaker: A, text: "我没有车队哈哈"}
      - {speaker: C, text: "我带你去 走"}
      - {speaker: A, text: "冲冲冲", emote: 2}

  real_life_group:
    participants: 3
    lines:
      - {speaker: A, text: "你们都哪的人"}
      - {speaker: B, text: "广东的"}
      - {speaker: C, text: "北京"}
      - {speaker: A, text: "我四川的！"}
      - {speaker: B, text: "可以 冒险岛真是哪的人都有", emote: 2}
      - {speaker: C, text: "爱了"}

  two_argue_third_mediates:
    participants: 3
    lines:
      - {speaker: A, text: "战士打BOSS就是没用"}
      - {speaker: B, text: "啊？？那谁给你扛伤害", emote: 6}
      - {speaker: A, text: "谁喝药快谁能扛"}
      - {speaker: C, text: "行了行了。每个职业都有用"}
      - {speaker: B, text: "谢谢 终于有个明白人"}
      - {speaker: A, text: "行吧 战士也还行吧"}
      - {speaker: C, text: "这就对了", emote: 0}

  halloween_event:
    participants: 3
    lines:
      - {speaker: A, text: "你们做万圣节活动吗？"}
      - {speaker: B, text: "做 这次奖励真不错"}
      - {speaker: C, text: "奖励是什么"}
      - {speaker: A, text: "有个披风和几把椅子"}
      - {speaker: B, text: "披风属性也可以"}
      - {speaker: C, text: "行我加入。从哪开始"}
      - {speaker: A, text: "找射手村公园的NPC"}

  # ═══════════════════════════════════════
  #  四人对话
  # ═══════════════════════════════════════

  party_formation:
    participants: 4
    lines:
      - {speaker: A, text: "好 谁去打天空副本"}
      - {speaker: B, text: "我。57牧师"}
      - {speaker: C, text: "加我。54游侠"}
      - {speaker: D, text: "62隐士报到"}
      - {speaker: A, text: "完美。最好再来两个战士"}
      - {speaker: B, text: "我问问我朋友 他是龙骑"}
      - {speaker: D, text: "走起", emote: 2}

  group_reaction:
    participants: 4
    lines:
      - {speaker: A, text: "你们刚才看到了吗！！", emote: 5}
      - {speaker: B, text: "什么？？"}
      - {speaker: C, text: "看到啥"}
      - {speaker: A, text: "有人把白卷扔地上了"}
      - {speaker: D, text: "哈哈谁会干这事", emote: 2}
      - {speaker: B, text: "手滑了？？"}
      - {speaker: C, text: "可能是炫富 或者手滑哈哈"}
      - {speaker: A, text: "反正我心脏骤停了一秒"}

  debate_2v2:
    participants: 4
    lines:
      - {speaker: A, text: "天空之城比玩具城强 不服来辩"}
      - {speaker: B, text: "同意。天空的音乐好太多"}
      - {speaker: C, text: "你们疯了吗？？玩具有副本有塔还有玩具工厂"}
      - {speaker: D, text: "对 玩具完胜。天空就是个坐船的中转站", emote: 1}
      - {speaker: A, text: "中转站？？天空有花园有云彩公园！"}
      - {speaker: B, text: "而且天空副本被低估了"}
      - {speaker: C, text: "那就求同存异吧"}
      - {speaker: D, text: "但玩具赢了", emote: 3}

  guild_meeting:
    participants: 4
    lines:
      - {speaker: A, text: "好 开会。第一项议题"}
      - {speaker: B, text: "能聊聊扎昆排期吗"}
      - {speaker: A, text: "可以。每周六晚8点全员到场"}
      - {speaker: C, text: "周六来不了怎么办"}
      - {speaker: A, text: "那就周日补一场"}
      - {speaker: D, text: "听着挺公平"}
