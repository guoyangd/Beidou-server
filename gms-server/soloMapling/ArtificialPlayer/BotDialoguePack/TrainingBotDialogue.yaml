# 训练 Bot（野外练级机器人）对话包——环境氛围台词，非任务文本。
# 经 executeBotContextDialogue 按上下文投递；上下文令牌：
#   自身:  {MAP} {REGION} {MOB} {DROP} {LEVEL}
#   玩家:  {PLAYER_NAME} {PLAYER_JOB} {PLAYER_WEAPON} {PLAYER_GEAR} {PLAYER_PET} {PLAYER_GUILD}
# 每个带令牌的节点都配有纯文本兜底行（令牌无法解析时引擎自动改用纯文本行）。
# 节点级 emote 是随机情绪盘，与所选台词解耦；行内 {line:, emote:} 指定该条情绪。
#
# 四职业签名台词位于兄弟键 TrainingBot_Warrior/_Mage/_Thief/_Bowman（处理端尚未按职业合并，先备好数据）。

