# 通用游荡 Bot（TownWandererBot）的城镇氛围对话。除射手村外各城镇通用（射手村有专属打磨文案）。
# 台词使用 {MAP}/{PLAYER_NAME}/{PLAYER_LEVEL} 上下文令牌，在废弃都市/魔法密林/勇士部落/林中之城/
# 天空之城/玩具城/雪原都能读通。保持通用性，不写射手村专属内容。
TownWandererBot:
  CongratsLevelUp:
    text:
      - "恭喜{PLAYER_NAME}！"
      - "漂亮，{PLAYER_LEVEL}级了"
      - "恭喜恭喜"
      - "哟 恭喜{PLAYER_NAME}"
      - "已经{PLAYER_LEVEL}级了？可以啊"
      - "继续肝{PLAYER_NAME}"
      - "好样的"
      - "恭喜升级"
      - "给力{PLAYER_NAME}"
      - "哦 升级了，恭喜{PLAYER_NAME}"
      - "冲啊{PLAYER_NAME}"
      - "{PLAYER_LEVEL}级了嘛，不错"
      - "恭喜{PLAYER_NAME} 保持住"
      - "一路升到{PLAYER_LEVEL} 挺能肝"
  PlayerReaction:
    text:
      - "哦嗨"
      - "咋样"
      - "你好啊"
      - "哟"
      - "路过而已"
      - "借过"
      - "之前没在{MAP}见过你啊"
      - "等等 我认识你吗？"
      - "嘿 看着点哈哈"
      - "{MAP}今天天气不错啊"
      - "新来的？"
      - "嗯？"
      - "哦 又是你哈哈"
      - "在忙啥呢"
      - "欢迎回来"
      - "{MAP}今天挺安静的"
      - "路上小心"
      - "回头一起组队？"
      - "*挥手*"
      - "好久不见"
  WanderChat:
    text:
      - "我刚才要去哪来着"
      - "嗯 往哪边走呢"
      - "出来活动活动腿脚"
      - "{MAP}其实挺不错的"
      - "啦啦啦~"
      - "今天商店有什么打折的"
      - "最近{MAP}人好多"
      - "真该回去练级了"
      - "*打哈欠*"
      - "这儿真安静"
      - "喜欢{MAP}这一块"
      - "人都去哪了"
      - "再绕{MAP}一圈"
      - "这城一点没变"
      - "枫币又不够了……"
      - "商店补货了没"
      - "嗯……"
      - "随便消磨时间"
  EmoteReaction:
    text:
      - "哈哈"
      - "笑死"
      - "不错"
      - "哦？"
      - "嗯！"
      - "嘿"
      - "那行吧"
      - "有点意思"
      - "不会吧"
      - ":)"
  MapTransition:
    text:
      - "我先溜达一会儿"
      - "出去转转 回见"
      - "稍等 去别处看看"
      - "我想往那边走走"
      - "{MAP}回见"
      - "该挪窝了"
      - "回头见"
      - "换个地方伸伸腿"
      - "去个新地方也不错"
      - "溜了溜了~"
